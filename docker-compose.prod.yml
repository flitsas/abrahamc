# Production docker-compose — used on the VPS.
# PostgreSQL runs on the host machine (not in Docker).
# Copy this file to the deploy directory on the VPS.
# Create a .env file alongside it with the variables listed below.
#
# Required .env variables:
#   ConnectionStrings__Core — full connection string to the host PostgreSQL
#                             e.g. Host=host.docker.internal;Port=5432;Database=flit_prod;Username=flit;Password=***
#   Cors__AllowedOrigins    — public URL of the frontend (e.g. https://app.tudominio.com)
#
# Optional .env variables:
#   PUBLIC_PORT             — host port to expose frontend (default: 8090)
#   ASPNETCORE_ENVIRONMENT  — default: Production

services:
  core-api:
    image: ghcr.io/flitsas/abrahamc/core-api:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3030:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Core: ${ConnectionStrings__Core}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
    restart: unless-stopped

  frontend:
    image: ghcr.io/flitsas/abrahamc/frontend:latest
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8090}:80"
    depends_on:
      - core-api
    restart: unless-stopped
