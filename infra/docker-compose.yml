services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flit
      POSTGRES_PASSWORD: flit_local
      POSTGRES_DB: flit_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flit -d flit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../services/core-api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Core: Host=postgres;Port=5432;Database=flit_dev;Username=flit;Password=flit_local
      Cors__AllowedOrigins: http://localhost:5173
    ports:
      - "3030:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3030/api/v1
    ports:
      - "5173:80"
    depends_on:
      - core-api

volumes:
  postgres_data:
